<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletagexample</title>
</head>
<br>
<body>
    <header>
        <h2>
            <center>Table Demo Application</center>
        </h2>
    </header>
    <hr>
    <main>
        <table border="2" align="center" bgcolor="#00ff00" cellpading="10px" cellspacing="10px">
            <thead>
                <tr>
                   <th rowspan="2">SNO</th> 
                   <th rowspan="2">TNO</th>
                   <th rowspan="2">NAME</th>
                   <th colspan="2">Route</th>
                   <th rowspan="2">Fair</th>
                   <th rowspan="2">Photo</th>
                   <th colspan="2">Time</th> 
                   <th colspan="4">Seat Available</th>
                   <th rowspan="2">PNR</th>  
                </tr>
                <tr>
                    <th>S</th>
                    <th>D</th>
                    <th>AT</th>
                    <th>DT</th>
                    <th>C1</th>
                    <th>C2</th>
                    <th>C3</th>
                    <th>C4</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>10021</td>
                    <td>Rjdhn</td>
                    <td>W</td>
                    <td>H</td>
                    <td>350</td>
                    <td><img src="d:\trainimage.jpeg">trainimage</td>
                    <td>4pm</td>
                    <td>7pm</td>
                    <td>10</td>
                    <td>5</td>
                    <td>10</td>
                    <td>18</td>
                    <td><a href="< a href=https://www.indianrail.gov.in/enquiry/PNR/PNREnquiry.html" target="_blank">Check PNR Status</a></td>

                </tr>
            </tbody>

        </table>
    </main>
</body>
</html>
